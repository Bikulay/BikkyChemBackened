<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BikkyChem AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #0f4c81, #1976d2);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            background: white;
            padding: 5px;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 32px;
        }

        .header p {
            margin: 5px 0;
            font-size: 16px;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
        }

        .question-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .question-section h2 {
            text-align: center;
            color: #0f4c81;
            margin-top: 0;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
        }

        textarea:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25,118,210,0.12);
        }

        .button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #0f4c81;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #083b63;
        }

        .button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #0f4c81;
            font-weight: bold;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8fafc;
            border-left: 5px solid #1976d2;
            border-radius: 10px;
        }

        #result h3 {
            color: #0f4c81;
            margin-bottom: 7px;
        }

        #result p {
            margin-top: 0;
            line-height: 1.6;
        }

        #steps,
        #hints {
            padding-left: 25px;
            line-height: 1.7;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            padding: 25px 15px;
            margin-top: 40px;
            background: #0f4c81;
            color: white;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 26px;
            }

            .header p {
                font-size: 14px;
            }

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .question-section {
                padding: 18px;
            }

            textarea {
                min-height: 130px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <!--
            IMPORTANT:
            Keep your actual logo filename here.

            If your logo is inside:
            static/images/logo.png

            then use:
            /static/images/logo.png
        -->

        <img
    src="/static/images/IMG_0898.png"
    alt="BikkyChem Logo"
    class="logo"
        >

        <h1>BikkyChem AI</h1>

        <p>
            Learn Chemistry through Topics, Formulas, Steps and Hints
        </p>

    </header>


    <!-- MAIN CONTENT -->
    <main class="container">

        <div class="question-section">

            <h2>Ask a Chemistry Question</h2>

            <textarea
                id="question"
                placeholder="Type your Chemistry question here..."
            ></textarea>

            <button
                type="button"
                class="button"
                id="askButton"
                onclick="askBikkyChem()">
                ASK BIKKYCHEM
            </button>


            <!-- LOADING MESSAGE -->
            <div id="loading">
                BikkyChem is analysing your question...
            </div>


            <!-- ERROR MESSAGE -->
            <div id="error"></div>


            <!-- RESULT -->
            <div id="result">

                <h3>Topic</h3>
                <p id="topic"></p>

                <h3>Formula</h3>
                <p id="formula"></p>

                <h3>Guided Steps</h3>
                <ul id="steps"></ul>

                <h3>Hints</h3>
                <ul id="hints"></ul>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <p>
            © 2026 BikkyChem AI
        </p>

        <p>
            Chemistry Guidance • Learn • Think • Solve
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script>

        async function askBikkyChem() {

            const question =
                document.getElementById("question").value.trim();

            const result =
                document.getElementById("result");

            const loading =
                document.getElementById("loading");

            const errorBox =
                document.getElementById("error");

            const askButton =
                document.getElementById("askButton");


            /*
             * Check whether the user entered a question.
             */

            if (!question) {

                errorBox.textContent =
                    "Please enter a Chemistry question.";

                errorBox.style.display = "block";
                result.style.display = "none";

                return;
            }


            /*
             * Clear previous result/error.
             */

            errorBox.style.display = "none";
            result.style.display = "none";

            loading.style.display = "block";
            askButton.disabled = true;


            try {

                /*
                 * Send the question to Flask.
                 */

                const response = await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })

                });


                /*
                 * Convert server response to JSON.
                 */

                const data = await response.json();


                /*
                 * Check whether Flask returned an error.
                 */

                if (!response.ok || data.error) {

                    throw new Error(
                        data.error ||
                        "Unable to process the question."
                    );

                }


                /*
                 * Display Topic.
                 */

                document.getElementById("topic").textContent =
                    data.topic || "Not available";


                /*
                 * Display Formula.
                 */

                document.getElementById("formula").textContent =
                    data.formula || "No formula required";


                /*
                 * Display Guided Steps.
                 */

                const steps =
                    document.getElementById("steps");

                steps.innerHTML = "";


                if (Array.isArray(data.steps)) {

                    data.steps.forEach(function(step) {

                        const li =
                            document.createElement("li");

                        li.textContent = step;

                        steps.appendChild(li);

                    });

                }


                /*
                 * Display Hints.
                 */

                const hints =
                    document.getElementById("hints");

                hints.innerHTML = "";


                if (Array.isArray(data.hints)) {

                    data.hints.forEach(function(hint) {

                        const li =
                            document.createElement("li");

                        li.textContent = hint;

                        hints.appendChild(li);

                    });

                }


                /*
                 * Show result.
                 */

                result.style.display = "block";

            }

            catch (error) {

                console.error(error);

                errorBox.textContent =
                    error.message ||
                    "Something went wrong. Please try again.";

                errorBox.style.display = "block";

            }

            finally {

                loading.style.display = "none";

                askButton.disabled = false;

            }

        }


        /*
         * Allow:
         * Ctrl + Enter / Command + Enter
         * to submit the question.
         */

        document
            .getElementById("question")
            .addEventListener("keydown", function(event) {

                if (
                    (event.ctrlKey || event.metaKey) &&
                    event.key === "Enter"
                ) {

                    askBikkyChem();

                }

            });

    </script>

</body>
</html>
